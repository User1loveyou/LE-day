<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luz ❤️ Erick</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CAPA -->

    <section id="home" class="screen active">

        <img src="img/Screenshot_20260606_224412_Instagram.jpg" class="cover-image">

        <div class="overlay">

            <h1>Luz ❤️ Erick</h1>

            <button id="startBtn">
                Por onde nosso amor anda
            </button>

        </div>

    </section>

    <!-- SENHA -->

    <section id="passwordScreen" class="screen">

        <div class="card">

            <h2>Antes de entrar...</h2>

            <p>Você lembra da nossa data?</p>

            <input
                type="text"
                id="password"
                placeholder="DD/MM/AAAA">

            <button id="verifyBtn">
                Entrar
            </button>

            <p id="error"></p>

        </div>

    </section>

    <!-- SPOTIFY -->

    <section id="spotifyScreen" class="screen spotify">

        <img src="img/Screenshot_20260606_224402_Instagram.jpg" class="spotify-cover">

        <h2>Nossa História</h2>

        <p>Luz & Erick ❤️</p>

        <button id="nextBtn">
            ▶
        </button>

    </section>

<script src="script.js"></script>

</body>
</html>
